      <div class="page-head"><h1>版本</h1><div class="sub">版本更新与环境强度</div></div>
      <input id="q" class="search" type="text" placeholder="搜索版本…" autocomplete="off">
      <div class="search-hint" id="hint">共 1 条</div>
      <div class="entity-grid"><a class="entity-card" data-kw="版本资料总览 持续更新 持续更新" href="../patches/patch-notes-overview/">
    
    <div class="t">版本资料总览</div>
    <div class="e">持续更新</div>
    <div class="meta">持续更新</div>
    </a></div>
      <script>
(function(){
  var input=document.getElementById('q'); if(!input)return;
  var cards=Array.prototype.slice.call(document.querySelectorAll('.entity-card,.gloss-card'));
  function go(){
    var v=input.value.trim().toLowerCase();
    cards.forEach(function(c){
      var kw=(c.getAttribute('data-kw')||'').toLowerCase();
      c.style.display = (!v || kw.indexOf(v)>-1) ? '' : 'none';
    });
    var shown=cards.filter(function(c){return c.style.display!=='none';}).length;
    var hint=document.getElementById('hint');
    if(hint) hint.textContent='当前显示 '+shown+' 条';
  }
  input.addEventListener('input',go); go();
})();
</script>
