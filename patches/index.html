      <script>
(function(){
  var input=document.getElementById('q'); if(!input)return;
  var cards=Array.prototype.slice.call(document.querySelectorAll('.entity-card,.gloss-card'));
  function go(){
    var v=input.value.trim().toLowerCase();
    cards.forEach(function(c){
      var kw=(c.getAttribute('data-kw')||'').toLowerCase();
      c.style.display = (!v || kw.indexOf(v)>-1) ? '' : 'none';
    });
    var shown=cards.filter(function(c){return c.style.display!=='none';}).length;
    var hint=document.getElementById('hint');
    if(hint) hint.textContent='当前显示 '+shown+' 条';
  }
  input.addEventListener('input',go); go();
})();
</script>

<script>
(function(){
  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('.section-card, .entity-card, .gloss-card, .section, .infobox');
  if(rm || !('IntersectionObserver' in window)){
    for(var i=0;i<items.length;i++) items[i].classList.add('in');
  } else {
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -8% 0px', threshold:0.08});
    for(var j=0;j<items.length;j++) io.observe(items[j]);
  }
  var canvas = document.querySelector('.hero-canvas');
  if(canvas && !rm){
    var ctx = canvas.getContext('2d'), w=0, h=0, dpr=1, parts=[], raf=0, running=true;
    function size(){ dpr=Math.min(2, window.devicePixelRatio||1); var r=canvas.getBoundingClientRect(); w=canvas.width=Math.max(1,r.width*dpr); h=canvas.height=Math.max(1,r.height*dpr); }
    function init(){ parts=[]; var n=Math.round(w*h/24000); for(var i=0;i<n;i++){ parts.push({x:Math.random()*w,y:Math.random()*h,r:(Math.random()*1.8+0.4)*dpr,vx:(Math.random()-.5)*0.18*dpr,vy:(Math.random()-.5)*0.18*dpr,a:Math.random()*0.5+0.15}); } }
    function frame(){
      ctx.clearRect(0,0,w,h);
      var g=ctx.createRadialGradient(w*0.5,h*0.18,0,w*0.5,h*0.18,h*0.95);
      g.addColorStop(0,'rgba(255,138,30,0.18)'); g.addColorStop(1,'rgba(255,138,30,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      for(var i=0;i<parts.length;i++){ var p=parts[i]; p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fillStyle='rgba(255,194,75,'+p.a+')'; ctx.fill(); }
      if(running) raf=requestAnimationFrame(frame);
    }
    size(); init(); frame();
    var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ cancelAnimationFrame(raf); size(); init(); frame(); }, 200); });
    document.addEventListener('visibilitychange', function(){ if(document.hidden){ running=false; cancelAnimationFrame(raf); } else if(!running){ running=true; frame(); } });
    var banner = canvas.closest ? canvas.closest('.hero-banner') : null;
    if(banner){ window.addEventListener('scroll', function(){ var y=window.scrollY||0; banner.style.setProperty('--py', Math.min(y*0.25,140)+'px'); }, {passive:true}); }
  }
})();
</script>
