<script>
(function(){
  var KEY='mlbb-theme';
  var btn=document.getElementById('themeToggle');
  var root=document.documentElement;
  var meta=document.querySelector('meta[name="theme-color"]');
  var modes=['auto','light','dark'];
  var labels={auto:'跟随',light:'日间',dark:'夜间'};
  function effIsDark(){
    if(root.getAttribute('data-theme')==='dark') return true;
    if(root.getAttribute('data-theme')==='light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function apply(mode){
    if(mode==='auto'){ root.removeAttribute('data-theme'); }
    else { root.setAttribute('data-theme',mode); }
    if(btn){ btn.setAttribute('data-mode',mode);
      btn.setAttribute('aria-label','主题：'+labels[mode]+'，点击切换');
      var lab=btn.querySelector('.t-label'); if(lab) lab.textContent=labels[mode]; }
    if(meta){ meta.setAttribute('content', effIsDark() ? '#070b14' : '#f3f6fc'); }
  }
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  apply(saved && modes.indexOf(saved)>-1 ? saved : 'auto'); // 默认跟随系统
  if(btn){ btn.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    var idx = cur==='light'?1:(cur==='dark'?2:0);
    var next = modes[(idx+1)%3];
    apply(next);
    try{ localStorage.setItem(KEY,next); }catch(e){}
  }); }
  // 跟随系统模式下，系统主题变化即时响应
  if(window.matchMedia){
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    var onCh=function(){ if(root.getAttribute('data-theme')===null) apply('auto'); };
    if(mq.addEventListener) mq.addEventListener('change',onCh);
    else if(mq.addListener) mq.addListener(onCh);
  }
})();
</script>
<script>
(function(){
  var body=document.body;
  var btn=document.getElementById('navToggle');
  if(btn){ btn.addEventListener('click',function(){
    var open=body.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', open?'true':'false');
  }); }
  var links=document.querySelector('.links');
  if(links){ links.addEventListener('click',function(e){ if(e.target.closest('a')) body.classList.remove('nav-open'); }); }
  document.addEventListener('click',function(e){
    if(body.classList.contains('nav-open') && !e.target.closest('.topnav')) body.classList.remove('nav-open');
  });
})();
</script>
<script>
(function(){
  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('.entity-card, .section, .infobox, .nav-card');
  if(rm || !('IntersectionObserver' in window)){
    for(var i=0;i<items.length;i++) items[i].classList.add('in');
  } else {
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -8% 0px', threshold:0.08});
    for(var j=0;j<items.length;j++) io.observe(items[j]);
  }
})();
</script>
