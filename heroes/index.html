      <script>
(function(){
  var input=document.getElementById('q'); if(!input)return;
  var cards=Array.prototype.slice.call(document.querySelectorAll('.entity-card,.gloss-card'));
  function go(){
    var v=input.value.trim().toLowerCase();
    cards.forEach(function(c){
      var kw=(c.getAttribute('data-kw')||'').toLowerCase();
      c.style.display = (!v || kw.indexOf(v)>-1) ? '' : 'none';
    });
    var shown=cards.filter(function(c){return c.style.display!=='none';}).length;
    var hint=document.getElementById('hint');
    if(hint) hint.textContent='当前显示 '+shown+' 条';
  }
  input.addEventListener('input',go); go();
})();
</script>
